# Quick Test Sweep with PubMedQA
# Minimal sweep for testing the sweep runner

name: quick_test_pubmedqa
description: "Minimal sweep for testing with PubMedQA (2 configurations)"

# Use base configuration
base_config: configs/base.yaml

# Parameters to sweep (just 2 configs)
parameters:
  - path: retrieval.k
    range:
      type: grid
      values: [5, 10]

# Evaluation settings - use PubMedQA which doesn't have the trust_remote_code issue
dataset: pubmedqa
split: train
max_questions: 5
seed: 42

# Execution settings
parallel: false
max_parallel: 1
save_artifacts: true

