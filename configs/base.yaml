# BioRAG Bench - Base Configuration
# This is the default configuration used when no custom config is specified.

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.0
  max_tokens: 350
  timeout: 30.0
  max_retries: 3

embeddings:
  provider: openai
  model: text-embedding-3-large
  batch_size: 100
  cache_enabled: true

chunking:
  type: recursive
  chunk_size: 350
  chunk_overlap: 40

retrieval:
  mode: mmr
  k: 10
  fetch_k: 50
  lambda_mult: 0.5

rerank:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_n: 50
  final_k: 8
  batch_size: 32

prompt:
  template: prompts/cite_and_abstain_v2.txt
  citation_policy: claim-level

abstention:
  min_evidence_score: 0.3
  min_evidence_chunks: 1
  enable_self_check: true

cost:
  max_questions: null
  max_total_tokens: null
  max_usd: null
  on_budget_exceeded: fail-fast

logging:
  level: INFO
  json_format: false
  include_timestamps: true
  log_file: null

paths:
  data_dir: data
  runs_dir: runs
  cache_dir: data/cache
  configs_dir: configs

